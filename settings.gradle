pluginManagement {
    repositories {
        mavenLocal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Resolve meteordevelopment:meteor-client from the local Meteor workspace when this
// addon is cloned under addon/.
def localMeteorRoot = file("../..")
if (new File(localMeteorRoot, "build.gradle.kts").exists()) {
    includeBuild(localMeteorRoot)
}
